compilers:
  glsl:
    glslang:
      type: ziparchive
      dir: glslang-{{name}}
      if: nightly
      install_always: true
      url: https://github.com/KhronosGroup/glslang/releases/download/main-tot/glslang-main-linux-x86_64-release.zip
      folder: bin
      check_exe: glslang --version
      targets:
        - trunk
