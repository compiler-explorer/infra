compilers:
  julia:
    type: tarballs
    compression: gz
    dir: julia-{{name}}
    check_exe: bin/julia --version
    major_minor: "{{ name.split('.')[:2] | join('.') }}"
    url: https://julialang-s3.julialang.org/bin/linux/x64/{{major_minor}}/julia-{{name}}-linux-x86_64.tar.gz
    targets:
      - 1.13.4
      - 1.12.7
      - 1.12.5
      - 1.11.9
      - 1.11.2
      - 1.10.13
      - 1.10.0
      - 1.9.4
      - 1.9.3
      - 1.8.5
      - 1.7.3
    nightly:
      if: nightly
      install_always: true
      targets:
        - name: nightly
          url: https://julialangnightlies-s3.julialang.org/bin/linux/x86_64/julia-latest-linux-x86_64.tar.gz
          strip_components: 1
          create_untar_dir: true
