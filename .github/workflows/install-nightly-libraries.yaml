name: Install Nightly libraries

on:
  schedule:
    - cron: '10 00 * * *'
  workflow_dispatch:

concurrency:
  group: install-nightly-libraries
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'compiler-explorer/infra'
    timeout-minutes: 360
    runs-on: [ 'self-hosted', 'ce', 'linux', 'x64', 'small' ]
    steps:
      - name: Clean workspace
        run: sudo find "${GITHUB_WORKSPACE:?}" -mindepth 1 -delete
      - uses: actions/checkout@v7
      - name: Set up environment
        run: make ce
      - name: Install nightly libraries
        run: sudo update_compilers/install_libraries.sh nightly
