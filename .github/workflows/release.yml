name: Release operations
run-name: ${{ inputs.environment }} ${{ inputs.action }}${{ inputs.action == 'deploy' && format(' {0}', inputs.buildnumber) || '' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to operate on'
        type: choice
        default: 'staging'
        required: true
        options:
        - staging
        - beta
        - winstaging
        - wintest
        - aarch64staging
        - gpu
      action:
        description: 'Operation to run'
        type: choice
        default: 'deploy'
        required: true
        options:
        - deploy
        - shutdown
        - cleanup
      branch:
        description: 'Branch to deploy (deploy only; ignored otherwise)'
        default: 'main'
        required: true
      buildnumber:
        description: 'Build number, or "latest" (deploy only; ignored otherwise)'
        default: 'latest'
        required: true
      capacity:
        description: 'Instance count for the new colour (deploy only; blank matches current)'
        default: ''
        required: false

jobs:
  release:
    runs-on: ['admin']

    steps:
    # The choice inputs are the first gate; this case is the second, so the workflow can only
    # ever touch the environment/action pairs listed here. prod, winprod and aarch64prod are
    # deliberately absent. gpu serves live traffic, so it can be deployed but not shut down.
    - name: Validate operation
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        ACTION: ${{ inputs.action }}
        BUILDNUMBER: ${{ inputs.buildnumber }}
        CAPACITY: ${{ inputs.capacity }}
      run: |
        case "${ENVIRONMENT}/${ACTION}" in
          staging/*|beta/*|winstaging/*|wintest/*|aarch64staging/*) ;;
          gpu/deploy|gpu/cleanup) ;;
          *) echo "::error::Unsupported operation '${ACTION}' on '${ENVIRONMENT}'"; exit 1 ;;
        esac
        case "${ACTION}" in
          deploy|shutdown|cleanup) ;;
          *) echo "::error::Unsupported action '${ACTION}'"; exit 1 ;;
        esac
        if [[ "${ACTION}" = "deploy" && -z "${BUILDNUMBER}" ]]; then
          echo "::error::deploy needs a build number (or 'latest')"
          exit 1
        fi
        if [[ -n "${CAPACITY}" && ! "${CAPACITY}" =~ ^[1-9][0-9]?$ ]]; then
          echo "::error::capacity must be a whole number from 1 to 99, or blank"
          exit 1
        fi
    - name: Update infra
      run: cd /home/ubuntu/infra && git pull && make ce
    - name: Blue-green deploy
      if: inputs.action == 'deploy'
      env:
        CE_ENVIRONMENT: ${{ inputs.environment }}
        BRANCH: ${{ inputs.branch }}
        BUILDNUMBER: ${{ inputs.buildnumber }}
        CAPACITY: ${{ inputs.capacity }}
      run: ce --env "${CE_ENVIRONMENT}" blue-green deploy --branch "${BRANCH}" --skip-confirmation --no-notify ${CAPACITY:+--capacity "${CAPACITY}"} "${BUILDNUMBER}"
    # shutdown and cleanup take neither a version nor --no-notify, so branch and
    # buildnumber are deliberately ignored for them.
    - name: Blue-green ${{ inputs.action }}
      if: inputs.action != 'deploy'
      env:
        CE_ENVIRONMENT: ${{ inputs.environment }}
        ACTION: ${{ inputs.action }}
      run: ce --env "${CE_ENVIRONMENT}" blue-green "${ACTION}" --skip-confirmation
