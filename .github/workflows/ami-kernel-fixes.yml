name: Link kernel issues to AMI changes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'terraform/**.tf'

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  link:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Comment with kernel issues this AMI change fixes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR" > pr.diff
          gh issue list --state open --limit 200 --search '"Ubuntu 24.04" in:title' --json number,title > issues.json
          gh pr view "$PR" --json comments --jq '.comments[].body' > existing.txt
          new_lines=()
          while IFS= read -r line; do
            if ! grep -qxF "$line" existing.txt; then
              new_lines+=("$line")
            fi
          done < <(python bin/ami_kernel_fixes.py pr.diff issues.json)
          if (( ${#new_lines[@]} > 0 )); then
            printf '%s\n' "${new_lines[@]}" | gh pr comment "$PR" --body-file -
          else
            echo "Nothing to link"
          fi
